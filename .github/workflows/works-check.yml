name: Check digitized works (no deployment)
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Validate editorial metadata and publication boundaries
        run: |
          bundle exec ruby tools/check_works.rb
          bundle exec ruby tools/test_works_publication.rb
      - name: Build and validate normal output
        run: |
          bundle exec jekyll build
          python3 tools/check_site.py
      - name: Build and validate unpublished local preview
        run: |
          bundle exec jekyll build --config _config.yml,_config.works-preview.yml --destination _site_test
          python3 tools/check_site.py --site _site_test
